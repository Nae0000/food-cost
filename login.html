<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>เข้าสู่ระบบ | FoodCost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        :root {
            --bg-color: #0f172a;
            /* Dark background similar to main app */
            --modal-bg: #1e293b;
            /* Card background */
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary-color: #0ea5e9;
            --input-bg: rgba(15, 23, 42, 0.5);
            --danger-color: #ef4444;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            font-family: 'Noto Sans Thai', sans-serif;
            color: var(--text-color);
        }

        .login-container {
            background: var(--modal-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .login-sub {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-input {
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .login-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .login-input:focus {
            border-color: var(--primary-color);
            background-color: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .login-btn {
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
            font-family: inherit;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .google-btn {
            background-color: white;
            color: #1f2937;
            /* Dark text for contrast */
            border: 1px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            font-weight: 600;
        }

        .google-btn:hover {
            background-color: #f1f5f9;
        }

        .error-msg {
            color: var(--danger-color);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .divider {
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 14px;
            position: relative;
        }

        .divider span {
            background: var(--modal-bg);
            padding: 0 10px;
            position: relative;
            z-index: 1;
        }

        .divider-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px solid var(--border-color);
            z-index: 0;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>

<body>
    <div class="lang-switcher">
        <button onclick="changeLoginLang('th')" id="lang-btn-th" class="lang-btn active">TH</button>
        <button onclick="changeLoginLang('en')" id="lang-btn-en" class="lang-btn">EN</button>
        <button onclick="changeLoginLang('ja')" id="lang-btn-ja" class="lang-btn">JA</button>
    </div>

    <div class="login-container">
        <div class="login-logo">🍳</div>
        <div class="login-title">FoodCost</div>
        <div class="login-sub" id="loginSubText">ระบบคิดต้นทุนอาหาร</div>

        <form id="loginForm" class="login-form">
            <input type="text" id="emailInput" class="login-input" placeholder="อีเมล" required>
            <input type="password" id="passwordInput" class="login-input" placeholder="รหัสผ่าน" required>
            <div style="text-align: right; margin-top: -5px; margin-bottom: 5px;">
                <a href="#" id="forgotPasswordBtn" style="color: var(--primary-color); text-decoration: none; font-size: 14px;">ลืมรหัสผ่าน?</a>
            </div>
            <button type="submit" id="loginSubmitBtn" class="login-btn">เข้าสู่ระบบ</button>
            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="error-msg" style="color: #10b981;"></div>
        </form>

        <div class="divider">
            <span id="loginOrText">หรือ</span>
            <div class="divider-line"></div>
        </div>

        <button id="googleLoginBtn" class="login-btn google-btn">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                <path fill="none" d="M0 0h48v48H0z" />
            </svg>
            <span id="loginGoogleText">เข้าสู่ระบบด้วย Google</span>
        </button>
    </div>

    <script src="firebase-config.js"></script>
    <script src="login.js"></script>
</body>

</html>
