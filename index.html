<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบคิดต้นทุนอาหาร | FoodCost</title>
  <meta name="description" content="ระบบคิดต้นทุนอาหารไทย จัดการหมวดหมู่ วัตถุดิบ เมนูอาหาร สูตรอาหาร พร้อม Webhook" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav class="sidebar" id="sidebar">
    <!-- Header: toggle button always visible; logo text hidden when collapsed -->
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🍳</span>
        <div class="logo-text">
          <span class="logo-title">FoodCost</span>
          <span class="logo-sub">ระบบคิดต้นทุน</span>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="ซ่อน / แสดง Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>

    <ul class="nav-menu">
      <li><a href="#dashboard" class="nav-link" data-page="dashboard" title="ภาพรวม">
          <span class="nav-icon">📊</span><span class="nav-label">ภาพรวม</span></a></li>
      <li><a href="#categories" class="nav-link" data-page="categories" title="หมวดหมู่อาหาร">
          <span class="nav-icon">🏷️</span><span class="nav-label">หมวดหมู่อาหาร</span></a></li>
      <li><a href="#ingredients" class="nav-link" data-page="ingredients" title="ต้นทุนวัตถุดิบ">
          <span class="nav-icon">🧂</span><span class="nav-label">ต้นทุนวัตถุดิบ</span></a></li>
      <li><a href="#menus" class="nav-link" data-page="menus" title="เมนูอาหาร">
          <span class="nav-icon">🍜</span><span class="nav-label">เมนูอาหาร</span></a></li>
      <li><a href="#sets" class="nav-link" data-page="sets" title="เมนูเซต">
          <span class="nav-icon">🍱</span><span class="nav-label">เมนูเซต</span></a></li>
      <li><a href="#recipes" class="nav-link" data-page="recipes" title="สูตรอาหาร">
          <span class="nav-icon">📋</span><span class="nav-label">สูตรอาหาร</span></a></li>
      <li class="nav-divider"></li>
      <li><a href="#webhook" class="nav-link" data-page="webhook" title="Webhook">
          <span class="nav-icon">🔗</span><span class="nav-label">Webhook</span></a></li>
      <li><a href="#settings" class="nav-link" data-page="settings" title="ตั้งค่า">
          <span class="nav-icon">⚙️</span><span class="nav-label">ตั้งค่า</span></a></li>
    </ul>

    <div class="sidebar-footer">
      <button class="btn-reset-data" id="resetDataBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        รีเซ็ตข้อมูล
      </button>
    </div>
  </nav>

  <main class="main-content" id="mainContent">
    <div class="page-container" id="pageContainer"></div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="globalModal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle"></h3>
      <button class="modal-close" id="modalClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="db.js"></script>
  <script src="core.js"></script>
  <script src="p_ingredients.js"></script>
  <script src="p_menus.js"></script>
  <script src="p_sets.js"></script>
  <script src="p_recipes.js"></script>
  <script src="p_webhook.js"></script>
  <script src="p_settings.js"></script>
  <script src="boot.js"></script>
