<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบคิดต้นทุนอาหาร | FoodCost</title>
  <meta name="description" content="ระบบคิดต้นทุนอาหารไทย จัดการหมวดหมู่ วัตถุดิบ เมนูอาหาร สูตรอาหาร พร้อม Webhook" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav class="sidebar" id="sidebar">
    <!-- Header: toggle button always visible; logo text hidden when collapsed -->
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🍳</span>
        <div class="logo-text">
          <span class="logo-title">FoodCost</span>
          <span class="logo-sub">ระบบคิดต้นทุน</span>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="ซ่อน / แสดง Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>

    <ul class="nav-menu">
      <li><a href="#dashboard" class="nav-link" data-page="dashboard" title="ภาพรวม">
          <span class="nav-icon">📊</span><span class="nav-label">ภาพรวม</span></a></li>
      <li><a href="#categories" class="nav-link" data-page="categories" title="หมวดหมู่อาหาร">
          <span class="nav-icon">🏷️</span><span class="nav-label">หมวดหมู่อาหาร</span></a></li>
      <li><a href="#ingredients" class="nav-link" data-page="ingredients" title="ต้นทุนวัตถุดิบ">
          <span class="nav-icon">🧂</span><span class="nav-label">ต้นทุนวัตถุดิบ</span></a></li>
      <li><a href="#menus" class="nav-link" data-page="menus" title="เมนูอาหาร">
          <span class="nav-icon">🍜</span><span class="nav-label">เมนูอาหาร</span></a></li>
      <li class="nav-divider"></li>
      <li><a href="#webhook" class="nav-link" data-page="webhook" title="Webhook">
          <span class="nav-icon">🔗</span><span class="nav-label">Webhook</span></a></li>
      <li><a href="#settings" class="nav-link" data-page="settings" title="ตั้งค่า">
          <span class="nav-icon">⚙️</span><span class="nav-label">ตั้งค่า</span></a></li>
    </ul>

    <div class="sidebar-footer">
      <button class="btn-reset-data" id="resetDataBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        รีเซ็ตข้อมูล
      </button>
    </div>
  </nav>

  <!-- Mobile Header -->
  <header class="mobile-header" id="mobileHeader">
    <div class="mobile-header-left">
      <span class="logo-icon">🍳</span>
      <span class="mobile-header-title" id="mobilePageTitle">FoodCost</span>
    </div>
    <button class="mobile-menu-btn" id="mobileSidebarBtn" title="Open menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </header>

  <main class="main-content" id="mainContent">
    <div class="page-container" id="pageContainer"></div>
  </main>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="bottom-nav" id="bottomNav">
    <a href="#dashboard" class="bottom-nav-item" data-page="dashboard">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label">ภาพรวม</span>
    </a>
    <a href="#ingredients" class="bottom-nav-item" data-page="ingredients">
      <span class="bottom-nav-icon">🧂</span>
      <span class="bottom-nav-label">วัตถุดิบ</span>

    <a href="#menus" class="bottom-nav-item" data-page="menus">
      <span class="bottom-nav-icon">🍜</span>

    <button class="bottom-nav-item" id="moreMenuBtn">
      <span class="bottom-nav-icon">⋯</span>
      <span class="bottom-nav-label">เพิ่มเติม</span>
    </button>
  </nav>

  <!-- More Menu Overlay (Mobile) -->
  <div class="more-overlay" id="moreOverlay">
    <div class="more-overlay-backdrop" id="moreOverlayBackdrop"></div>
    <div class="more-overlay-panel">
      <div class="more-overlay-header">
        <span>เมนูเพิ่มเติม</span>
        <button class="modal-close" id="moreOverlayClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="more-overlay-body">
        <a href="#categories" class="more-item" data-page="categories" onclick="closeMoreOverlay()">
          <span class="more-item-icon">🏷️</span><span>หมวดหมู่อาหาร</span>
        </a>
        <a href="#webhook" class="more-item" data-page="webhook" onclick="closeMoreOverlay()">
          <span class="more-item-icon">🔗</span><span>Webhook</span>
        </a>
        <a href="#settings" class="more-item" data-page="settings" onclick="closeMoreOverlay()">
          <span class="more-item-icon">⚙️</span><span>ตั้งค่า</span>
        </a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="globalModal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle"></h3>
      <button class="modal-close" id="modalClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="db.js"></script>
  <script src="core.js"></script>
  <script src="p_ingredients.js"></script>
  <script src="p_menus.js"></script>
  <script src="p_sets.js"></script>
  <script src="p_recipes.js"></script>
  <script src="p_sub_recipe.js"></script>
  <script src="p_webhook.js"></script>
  <script src="p_gdrive.js"></script>
  <script src="p_settings.js"></script>
